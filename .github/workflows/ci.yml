name: Streamlit App CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Streamlit app syntax
        run: |
          python -c "import ast, sys; ast.parse(open('dashboard.py').read()); print('✅ dashboard.py syntax OK')"
          python -c "import ast, sys; ast.parse(open('export_for_powerbi.py').read()); print('✅ export_for_powerbi.py syntax OK')"
          python -c "import ast, sys; ast.parse(open('untitled1.py').read()); print('✅ untitled1.py syntax OK')"
